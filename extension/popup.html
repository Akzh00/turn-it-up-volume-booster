<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Turn It Up</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <h1>Turn It Up</h1>
    <span id="boosted" class="tag" hidden>Boosted</span>
  </header>
  <label class="level" for="volume">
    <span class="visually-hidden">Volume of this tab</span>
    <output id="value" for="volume"><span class="number">100</span><span class="unit">%</span></output>
  </label>
  <div class="slider">
    <input id="volume" type="range" min="0" max="200" step="5" value="100">
  </div>
  <div class="ends" aria-hidden="true"><span>0%</span><span>100%</span><span>200%</span></div>
  <button id="reset" type="button">Reset to 100%</button>
  <p id="error" role="alert"></p>
  <script type="module" src="popup.js"></script>
</body>
</html>
